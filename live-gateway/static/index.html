<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直播辩论系统 - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { font-size: 64px; margin-bottom: 16px; }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .link:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .link-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .link-secondary {
      background: #f5f5f5;
      color: #555;
    }
    .tech-stack {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .tag {
      background: #f0f0f0;
      color: #777;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎤</div>
    <h1>直播辩论系统</h1>
    <p class="subtitle">Live Debate System · Demo</p>
    <div class="links">
      <a href="/admin" class="link link-primary">📊 进入管理后台</a>
      <a href="/dashboard" class="link link-primary" style="background: linear-gradient(135deg, #1a2326, #2c3e50);">📊 辩论数据大屏</a>
      <a href="/votes" class="link link-secondary">🗳 查看实时投票</a>
    </div>
    <div class="tech-stack">
      <span class="tag">Node.js</span>
      <span class="tag">Express</span>
      <span class="tag">WebSocket</span>
      <span class="tag">JSON 存储</span>
      <span class="tag">Mock 数据</span>
      <span class="tag">Render 部署</span>
    </div>
  </div>
</body>
</html>
